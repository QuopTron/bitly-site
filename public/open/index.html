<!doctype html>
<!--
  index.html — Página de respaldo de los enlaces compartidos de Bitly.

  Qué hace: cuando el enlace https://<dominio>/open?s=... NO lo abre la app
  (no está instalada, o iOS todavía no verificó el Universal Link), se carga
  esta página; intenta abrir Bitly con el esquema propio (bitly://open?s=...) y,
  si no pasa nada, muestra el enlace para copiarlo y abrirlo a mano.

  En blanco y negro, sin dependencias externas y sin servidor: es un archivo
  estático más del hosting (deeplinks/README.md explica cómo publicarlo).
-->
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bitly — te compartieron una canción</title>
    <style>
      :root {
        color-scheme: light dark;
        --fondo: #ffffff;
        --texto: #111111;
        --suave: #6b6b6b;
        --borde: #dddddd;
        --placa: #f6f6f6;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fondo: #0b0b0b;
          --texto: #f5f5f5;
          --suave: #9a9a9a;
          --borde: #2a2a2a;
          --placa: #161616;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--fondo);
        color: var(--texto);
        font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .carta {
        width: 100%;
        max-width: 320px;
        padding: 20px;
        text-align: center;
        border: 1px solid var(--borde);
        border-radius: 18px;
        background: var(--placa);
      }
      .sello {
        margin: 0 0 10px;
        font-size: 11px;
        letter-spacing: 2.4px;
        font-weight: 700;
        color: var(--suave);
      }
      .icono { font-size: 40px; line-height: 1; margin: 0 0 12px; }
      h1 { margin: 0; font-size: 18px; font-weight: 800; }
      .sub { margin: 6px 0 18px; font-size: 13px; color: var(--suave); }
      button {
        width: 100%;
        min-height: 42px;
        margin: 0 0 8px;
        padding: 10px 16px;
        font: inherit;
        font-weight: 700;
        border-radius: 22px;
        cursor: pointer;
      }
      .principal { background: var(--texto); color: var(--fondo); border: 0; }
      .secundaria {
        background: transparent;
        color: var(--texto);
        border: 1px solid var(--borde);
      }
      .nota { margin: 12px 0 0; font-size: 12px; color: var(--suave); }
      .nota a { color: var(--suave); }
      .oculto { display: none; }
    </style>
  </head>
  <body>
    <main class="carta">
      <p class="sello">TE COMPARTIERON</p>
      <p class="icono" aria-hidden="true">🎵</p>
      <h1 id="titulo">Una canción</h1>
      <p class="sub" id="sub">Abrila en Bitly y se agrega a tu cola.</p>

      <button class="principal" id="abrir">Abrir en Bitly</button>
      <button class="secundaria" id="copiar">Copiar el enlace</button>

      <p class="nota" id="nota">
        ¿No tenés Bitly? Descargala desde la última release de GitHub:
        <a href="https://github.com/QuopTron/bitly-releases/releases" target="_blank" rel="noopener noreferrer">github.com/QuopTron/bitly-releases</a>
      </p>
    </main>

    <script>
      // El enlace de la app usa el MISMO payload cifrado (?s=...): se pasa tal
      // cual al esquema propio, sin descifrar nada en el navegador.
      var params = new URLSearchParams(location.search);
      var payload = params.get('s') || '';
      var enlaceApp = 'bitly://open' + (payload ? '?s=' + encodeURIComponent(payload) : '');

      // Si el salto a la app funcionó, la pestaña queda oculta y no se avisa
      // nada; si sigue visible, se muestran las instrucciones.
      var salio = false;
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) salio = true;
      });

      function abrirApp() {
        salio = false;
        document.getElementById('copiar').classList.remove('oculto');
        location.href = enlaceApp;
        setTimeout(function () {
          if (!salio && !document.hidden) {
            document.getElementById('nota').textContent =
              'No pudimos abrir la app. Copiá el enlace y pegálo en Bitly ' +
              '(Compartir → Bitly) para ver la canción.';
          }
        }, 1400);
      }

      document.getElementById('abrir').addEventListener('click', abrirApp);

      document.getElementById('copiar').addEventListener('click', function () {
        var boton = this;
        navigator.clipboard.writeText(location.href).then(function () {
          boton.textContent = 'Enlace copiado';
          setTimeout(function () { boton.textContent = 'Copiar el enlace'; }, 1800);
        });
      });

      // Intento automático solo si el enlace trae la canción compartida.
      if (payload) abrirApp();
    </script>
  </body>
</html>
