<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>404 — Página no encontrada | Bitly</title>
    <meta
      name="description"
      content="La página que buscas no existe o fue movida. Volvé al inicio de Bitly."
    />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <style>
      :root {
        color-scheme: light dark;
        --fondo: #001f2a;
        --texto: #f2fffb;
        --suave: #9fe7cd;
        --borde: rgba(159, 231, 205, 0.28);
      }
      @media (prefers-color-scheme: light) {
        :root {
          --fondo: #f3fbf7;
          --texto: #0b2b2c;
          --suave: #1d6b57;
          --borde: rgba(29, 107, 87, 0.3);
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--fondo);
        color: var(--texto);
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
        text-align: center;
      }
      main {
        max-width: 34rem;
      }
      img {
        width: 112px;
        height: 112px;
        display: block;
        margin: 0 auto 1.25rem;
      }
      h1 {
        margin: 0;
        font-size: clamp(3rem, 12vw, 5rem);
        line-height: 1;
        letter-spacing: -0.03em;
      }
      p {
        margin: 0.75rem 0 0;
        color: var(--suave);
      }
      a {
        display: inline-block;
        margin-top: 1.75rem;
        padding: 0.85rem 1.75rem;
        border-radius: 999px;
        background: var(--texto);
        color: var(--fondo);
        font-weight: 700;
        text-decoration: none;
      }
      a:hover,
      a:focus-visible {
        outline: 2px solid var(--suave);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/android-chrome-192x192.png" alt="Bitly" width="192" height="192" />
      <h1>404</h1>
      <p>Página no encontrada. El enlace pudo haber cambiado o ya no existe.</p>
      <p>¿Buscabas descargar Bitly o ver una guía de instalación?</p>
      <a href="/">Volver al inicio</a>
    </main>
  </body>
</html>
