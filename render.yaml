# Blueprint de Render para el backend de la demo.
#
# Crear el servicio: Render → New → Blueprint → elegir este repo. Toma este
# archivo y arma el servicio Docker con el health check ya puesto.
#
# El plan free apaga la instancia después de ~15 minutos sin tráfico. No hace
# falta pagar: el sitio la despierta cuando alguien abre la demo (ver
# «Despertar del backend propio» en src/server/rescate.ts) y la búsqueda le da
# una gracia corta para que el arranque no se note.
services:
  - type: web
    name: bitly-yt-dlp
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.backend
    healthCheckPath: /salud
    autoDeploy: true
    envVars:
      # El servidor escucha en 0.0.0.0; Render pasa el puerto por PORT.
      - key: HOST
        value: 0.0.0.0
      # Secreto compartido con el sitio. Render lo pide al crear el servicio
      # (sync: false = no queda escrito en el repo).
      - key: YT_DLP_TOKEN
        sync: false
