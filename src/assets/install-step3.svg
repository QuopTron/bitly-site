<svg xmlns="http://www.w3.org/2000/svg" width="480" height="854" viewBox="0 0 480 854">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="mint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5ce0b8"/>
      <stop offset="100%" style="stop-color:#3dd9a0"/>
    </linearGradient>
  </defs>
  <rect width="480" height="854" rx="24" fill="url(#bg)"/>
  <!-- Status bar -->
  <rect x="0" y="0" width="480" height="44" fill="#0d1117"/>
  <text x="240" y="30" text-anchor="middle" font-family="system-ui" font-size="14" fill="#8b949e">9:43</text>
  <!-- Dialog box -->
  <rect x="60" y="100" width="360" height="280" rx="20" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="240" y="150" text-anchor="middle" font-family="system-ui" font-size="16" font-weight="bold" fill="#e6edf3">Instalar esta app?</text>
  <text x="240" y="180" text-anchor="middle" font-family="system-ui" font-size="12" fill="#8b949e">Bitly</text>
  <!-- App icon -->
  <rect x="200" y="195" width="80" height="80" rx="16" fill="url(#mint)"/>
  <text x="240" y="248" text-anchor="middle" font-family="system-ui" font-size="28" fill="#0d1117">♪</text>
  <text x="240" y="310" text-anchor="middle" font-family="system-ui" font-size="12" fill="#8b949e">¿Quieres instalar esta aplicación?</text>
  <!-- Buttons -->
  <rect x="60" y="340" width="180" height="40" rx="20" fill="none" stroke="#30363d" stroke-width="1"/>
  <text x="150" y="365" text-anchor="middle" font-family="system-ui" font-size="14" fill="#8b949e">Cancelar</text>
  <rect x="240" y="340" width="180" height="40" rx="20" fill="url(#mint)"/>
  <text x="330" y="365" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="bold" fill="#0d1117">Instalar</text>
  <!-- Permissions section -->
  <text x="40" y="440" font-family="system-ui" font-size="13" font-weight="bold" fill="#8b949e">PERMISOS REQUERIDOS</text>
  <rect x="20" y="460" width="440" height="48" rx="10" fill="#21262d"/>
  <text x="40" y="490" font-family="system-ui" font-size="12" fill="#8b949e">📱 Almacenamiento — Guardar archivos de música</text>
  <rect x="20" y="520" width="440" height="48" rx="10" fill="#21262d"/>
  <text x="40" y="550" font-family="system-ui" font-size="12" fill="#8b949e">🌐 Red — Buscar y descargar canciones</text>
  <!-- Instructions -->
  <rect x="40" y="600" width="400" height="3" rx="1.5" fill="#30363d" opacity="0.3"/>
  <text x="240" y="660" text-anchor="middle" font-family="system-ui" font-size="18" font-weight="bold" fill="#5ce0b8">PASO 3</text>
  <text x="240" y="695" text-anchor="middle" font-family="system-ui" font-size="15" fill="#e6edf3">Presiona "Instalar"</text>
  <text x="240" y="725" text-anchor="middle" font-family="system-ui" font-size="13" fill="#8b949e">Acepta los permisos y espera a que</text>
  <text x="240" y="755" text-anchor="middle" font-family="system-ui" font-size="13" fill="#8b949e">termine la instalación</text>
  <rect x="8" y="8" width="464" height="838" rx="20" fill="none" stroke="#30363d" stroke-width="1.5"/>
</svg>
