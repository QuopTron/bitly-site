<svg xmlns="http://www.w3.org/2000/svg" width="480" height="854" viewBox="0 0 480 854">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="mint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5ce0b8"/>
      <stop offset="100%" style="stop-color:#3dd9a0"/>
    </linearGradient>
  </defs>
  <rect width="480" height="854" rx="24" fill="url(#bg)"/>
  <!-- Status bar -->
  <rect x="0" y="0" width="480" height="44" fill="#0d1117"/>
  <text x="240" y="30" text-anchor="middle" font-family="system-ui" font-size="14" fill="#8b949e">9:45</text>
  <!-- Success banner -->
  <rect x="20" y="60" width="440" height="100" rx="16" fill="#161b22" stroke="#238636" stroke-width="1.5"/>
  <rect x="40" y="80" width="48" height="48" rx="24" fill="#238636" opacity="0.2"/>
  <text x="64" y="112" text-anchor="middle" font-family="system-ui" font-size="24" fill="#3fb950">✓</text>
  <text x="100" y="100" font-family="system-ui" font-size="15" font-weight="bold" fill="#3fb950">App instalada</text>
  <text x="100" y="120" font-family="system-ui" font-size="12" fill="#8b949e">Bitly se instaló correctamente</text>
  <!-- Open button -->
  <rect x="40" y="140" width="160" height="44" rx="22" fill="url(#mint)"/>
  <text x="120" y="168" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="bold" fill="#0d1117">Abrir</text>
  <rect x="210" y="140" width="160" height="44" rx="22" fill="none" stroke="#30363d" stroke-width="1"/>
  <text x="290" y="168" text-anchor="middle" font-family="system-ui" font-size="14" fill="#8b949e">Listo</text>
  <!-- App screen preview -->
  <rect x="20" y="210" width="440" height="360" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <rect x="20" y="210" width="440" height="50" rx="16" fill="#161b22"/>
  <text x="40" y="242" font-family="system-ui" font-size="16" font-weight="bold" fill="#5ce0b8">Bitly</text>
  <text x="400" y="242" font-family="system-ui" font-size="14" fill="#8b949e">☰</text>
  <!-- Search bar -->
  <rect x="40" y="280" width="400" height="44" rx="22" fill="#21262d"/>
  <text x="60" y="308" font-family="system-ui" font-size="13" fill="#8b949e">🔍 Buscar canción, álbum o artista...</text>
  <!-- Song cards -->
  <rect x="40" y="340" width="190" height="100" rx="12" fill="#21262d"/>
  <rect x="52" y="352" width="64" height="64" rx="8" fill="#1f6feb" opacity="0.3"/>
  <text x="84" y="392" text-anchor="middle" font-family="system-ui" font-size="20" fill="#1f6feb">♪</text>
  <text x="128" y="375" font-family="system-ui" font-size="11" font-weight="bold" fill="#e6edf3">Midnight Rain</text>
  <text x="128" y="393" font-family="system-ui" font-size="10" fill="#8b949e">Taylor Swift</text>
  <rect x="52" y="408" width="56" height="20" rx="10" fill="#238636" opacity="0.2"/>
  <text x="80" y="422" text-anchor="middle" font-family="system-ui" font-size="9" font-weight="bold" fill="#3fb950">FLAC</text>
  <rect x="250" y="340" width="190" height="100" rx="12" fill="#21262d"/>
  <rect x="262" y="352" width="64" height="64" rx="8" fill="#8957e5" opacity="0.3"/>
  <text x="294" y="392" text-anchor="middle" font-family="system-ui" font-size="20" fill="#8957e5">♪</text>
  <text x="338" y="375" font-family="system-ui" font-size="11" font-weight="bold" fill="#e6edf3">Blinding Lights</text>
  <text x="338" y="393" font-family="system-ui" font-size="10" fill="#8b949e">The Weeknd</text>
  <rect x="262" y="408" width="56" height="20" rx="10" fill="#238636" opacity="0.2"/>
  <text x="290" y="422" text-anchor="middle" font-family="system-ui" font-size="9" font-weight="bold" fill="#3fb950">FLAC</text>
  <!-- Bottom nav -->
  <rect x="20" y="520" width="440" height="50" rx="0" fill="#161b22"/>
  <text x="80" y="552" text-anchor="middle" font-family="system-ui" font-size="10" fill="#5ce0b8">🏠 Inicio</text>
  <text x="170" y="552" text-anchor="middle" font-family="system-ui" font-size="10" fill="#8b949e">🔍 Buscar</text>
  <text x="260" y="552" text-anchor="middle" font-family="system-ui" font-size="10" fill="#8b949e">📚 Biblioteca</text>
  <text x="350" y="552" text-anchor="middle" font-family="system-ui" font-size="10" fill="#8b949e">⚙ Ajustes</text>
  <!-- Instructions -->
  <rect x="40" y="600" width="400" height="3" rx="1.5" fill="#30363d" opacity="0.3"/>
  <text x="240" y="660" text-anchor="middle" font-family="system-ui" font-size="18" font-weight="bold" fill="#5ce0b8">¡LISTO!</text>
  <text x="240" y="695" text-anchor="middle" font-family="system-ui" font-size="15" fill="#e6edf3">Abre Bitly y busca tu música</text>
  <text x="240" y="725" text-anchor="middle" font-family="system-ui" font-size="13" fill="#8b949e">Descarga en calidad FLAC sin pérdida</text>
  <text x="240" y="755" text-anchor="middle" font-family="system-ui" font-size="13" fill="#8b949e"> desde Tidal, Qobuz, Deezer y más</text>
  <rect x="8" y="8" width="464" height="838" rx="20" fill="none" stroke="#30363d" stroke-width="1.5"/>
</svg>
