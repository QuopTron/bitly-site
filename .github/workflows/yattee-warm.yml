name: yattee-warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: yattee-warm
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Despertar los backends de audio
        env:
          YATTEE_URL: ${{ secrets.YATTEE_URL }}
          YATTEE_URL_2: ${{ secrets.YATTEE_URL_2 }}
          YATTEE_URL_3: ${{ secrets.YATTEE_URL_3 }}
          YATTEE_AUTH: ${{ secrets.YATTEE_AUTH }}
        run: |
          if [ -z "$YATTEE_URL" ]; then
            echo "Sin el secreto YATTEE_URL: no hay nada que despertar."
            exit 0
          fi
          for base in "$YATTEE_URL" "$YATTEE_URL_2" "$YATTEE_URL_3"; do
            if [ -z "$base" ]; then
              continue
            fi
            auth=()
            if [ -n "$YATTEE_AUTH" ]; then
              auth=(-u "$YATTEE_AUTH")
            fi
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 120 "${auth[@]}" "$base/" || echo 000)
            echo "$base -> $code"
          done
