# Config de Cloudflare PAGES para este proyecto (git-connected, rama master).
#
# CUIDADO: el builder de Pages valida este archivo y ABORTA el build si tiene
# claves que no soporta. Las que rompieron el build de 084a209 fueron:
#   - "account_id"  → no soportada (la cuenta la fija el proyecto de Pages)
#   - "[build]"     → no soportada (el build command va en el dashboard)
# Si `pages_build_output_dir` no está, Pages ignora el archivo en silencio y
# publica estáticos: la demo queda en 405. Si el archivo es válido y además
# tiene una clave no soportada, el build falla. Sólo dejamos las soportadas.
#
# Para comandos locales que necesiten la cuenta (p. ej. `wrangler pages deploy`),
# usá la variable de entorno `CLOUDFLARE_ACCOUNT_ID` en lugar de ponerla acá.

name = "bitly-site"
pages_build_output_dir = "dist/client"

# `nodejs_compat` es lo que deja leer `process.env.BITLY_CODES_TOKEN` desde el
# canje de códigos Premium: sin esto el runtime del Worker no tiene `process` y
# el canje responde "no pudimos verificar". Requiere fecha >= 2024-09-23.
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# La demo necesita SERVIDOR (server functions cifradas): la búsqueda, el rescate
# de audio y el canje de códigos no pueden correr en el navegador. Publicar solo
# `dist/client` dejaba ese RPC en 405. Por eso `pnpm build` (vite build + el
# script scripts/cloudflare-worker.mjs) deja `dist/client/_worker.js` y
# `dist/client/_ssr/`: eso activa el MODO AVANZADO de Pages. Ver
# CLOUDFLARE_DEPLOY.md.
