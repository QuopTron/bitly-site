name = "bitly-site"
account_id = "a5e62a1e8ae4840916ed4122689e507c"
pages_build_output_dir = "dist/client"

# `nodejs_compat` es lo que deja leer `process.env.BITLY_CODES_TOKEN` desde el
# canje de códigos Premium: sin esto, el runtime del Worker no tiene `process` y
# el canje responde "no pudimos verificar". Requiere fecha >= 2024-09-23.
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[build]
command = "pnpm build"

# La demo necesita SERVIDOR (server functions cifradas): la búsqueda, el rescate
# de audio y el canje de códigos no pueden correr en el navegador. Publicar solo
# `dist/client` dejaba ese RPC en 405. `pnpm build` corre el `postbuild`
# (scripts/cloudflare-worker.mjs), que deja `dist/client/_worker.js` y
# `dist/client/_ssr/`: eso activa el MODO AVANZADO de Pages y la app atiende
# todo, incluidos los assets. Ver CLOUDFLARE_DEPLOY.md.
