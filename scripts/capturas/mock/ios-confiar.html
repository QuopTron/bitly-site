<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iOS · confiar en el desarrollador</title>
<style>
  :root{--bg:#F2F2F7;--card:#FFFFFF;--tinta:#000;--gris:#8A8A8E;--azul:#0A84FF;--sep:#D9D9DE}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tinta);
    font-family:-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .pantalla{width:100%;height:100%}

  .estado{height:52px;padding:0 26px 0 30px;display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:600}
  .isla{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:104px;height:30px;border-radius:16px;background:#000}
  .estado .iconos{display:flex;align-items:center;gap:6px}

  .nav{display:flex;align-items:center;gap:6px;padding:2px 16px 10px;color:var(--azul);font-size:17px}
  .nav svg{margin-top:1px}

  .titulo-grupo{margin:18px 16px 7px;font-size:13px;color:var(--gris);text-transform:uppercase;letter-spacing:.4px}
  .grupo{margin:0 16px;background:var(--card);border-radius:12px;overflow:hidden}
  .fila{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--sep)}
  .fila:last-child{border-bottom:none}
  .fila .txt{flex:1;min-width:0}
  .fila .t1{font-size:16px}
  .fila .t2{font-size:13px;color:var(--gris);margin-top:2px}
  .chev{color:#C3C3C8;font-size:18px}
  .acento{color:var(--azul);font-size:16px;text-align:center;padding:14px 16px;font-weight:500}
  .pie{margin:10px 20px 0;font-size:13px;line-height:1.45;color:var(--gris)}

  .escudo{width:34px;height:34px;border-radius:9px;background:linear-gradient(160deg,#9aa4b2,#5f6a79);
    display:grid;place-items:center;flex:none}
</style>
</head>
<body>
<div class="pantalla">
  <div class="estado">
    <span>9:41</span>
    <div class="isla"></div>
    <div class="iconos">
      <svg width="18" height="13" viewBox="0 0 18 13" aria-hidden="true">
        <rect x="0" y="8" width="3" height="5" rx="1" fill="#000"/><rect x="4.6" y="5.6" width="3" height="7.4" rx="1" fill="#000"/>
        <rect x="9.2" y="3" width="3" height="10" rx="1" fill="#000"/><rect x="13.8" y="0.6" width="3" height="12.4" rx="1" fill="#000"/>
      </svg>
      <svg width="17" height="12" viewBox="0 0 17 12" aria-hidden="true"><path d="M8.5 10.4 1.6 3.6a10 10 0 0 1 13.8 0L8.5 10.4Z" fill="#000"/></svg>
      <svg width="26" height="13" viewBox="0 0 26 13" aria-hidden="true">
        <rect x="0.5" y="0.5" width="21" height="12" rx="3.5" stroke="rgba(0,0,0,.35)"/>
        <rect x="2.2" y="2.2" width="15" height="8.6" rx="2" fill="#000"/>
        <path d="M23.4 4.6v3.8c1-.3 1.5-.9 1.5-1.9s-.5-1.6-1.5-1.9Z" fill="rgba(0,0,0,.4)"/>
      </svg>
    </div>
  </div>

  <div class="nav">
    <svg width="11" height="19" viewBox="0 0 12 20" fill="none" aria-hidden="true">
      <path d="M10 2 3 10l7 8" stroke="#0A84FF" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    General
  </div>

  <div class="titulo-grupo">VPN y gestión de dispositivos</div>
  <div class="grupo">
    <div class="fila">
      <div class="escudo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 2.6 4.6 5.3v6c0 4.5 3 8.4 7.4 9.7 4.4-1.3 7.4-5.2 7.4-9.7v-6L12 2.6Z" stroke="#fff" stroke-width="1.7" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="txt">
        <div class="t1">Apple Development: tu@email.com</div>
        <div class="t2">Bitly · Firma de desarrollador</div>
      </div>
      <div class="chev">›</div>
    </div>
    <div class="fila"><div class="acento" style="flex:1">Confiar en «Apple Development: tu@email.com»</div></div>
  </div>
  <p class="pie">Al confiar en este perfil, la app firmada con tu Apple ID va a poder abrirse en tu iPhone.</p>

  <div class="titulo-grupo">Perfil de dispositivo</div>
  <div class="grupo">
    <div class="fila">
      <div class="txt"><div class="t1">Borrar perfil</div></div>
      <div class="chev">›</div>
    </div>
  </div>
</div>
</body>
</html>
