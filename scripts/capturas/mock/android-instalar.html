<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Android · instalar Bitly</title>
<style>
  :root{
    --bg:#101014; --sup2:#2B2930; --on:#E6E1E5; --on2:#CAC4D0;
    --primary:#A8C7FA; --primary-dark:#0B3355;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;color:var(--on);
    font-family:Roboto,"Segoe UI",system-ui,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .pantalla{position:relative;width:100%;height:100%;background:
    radial-gradient(120% 70% at 50% 12%,#1d2a3a 0%,#141419 55%,#0d0d11 100%)}

  .estado{position:relative;height:44px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
    font-size:14px;font-weight:500}
  .estado .iconos{display:flex;align-items:center;gap:5px}
  .barras{display:flex;align-items:flex-end;gap:2px;opacity:.9}
  .barras i{display:block;width:3px;border-radius:1px;background:var(--on)}
  .barras i:nth-child(1){height:5px}.barras i:nth-child(2){height:8px}
  .barras i:nth-child(3){height:11px}.barras i:nth-child(4){height:14px}
  .bateria{width:22px;height:11px;border:1.5px solid var(--on);border-radius:3px;position:relative;opacity:.9}
  .bateria::after{content:"";position:absolute;right:-4px;top:3px;width:2px;height:5px;border-radius:0 2px 2px 0;background:var(--on)}
  .bateria i{position:absolute;inset:1.5px;right:5px;border-radius:1px;background:var(--on)}

  /* pantalla del instalador (queda detrás del velo) */
  .instalador{position:absolute;inset:44px 0 0;display:flex;flex-direction:column;align-items:center;
    padding:34px 32px 28px;text-align:center}
  .icono{width:82px;height:82px;border-radius:22px;display:grid;place-items:center;
    background:linear-gradient(140deg,#7BE0B7 0%,#3FC7A6 55%,#1E9E8A 100%);
    box-shadow:0 14px 30px rgba(63,199,166,.28)}
  .nombre{margin-top:18px;font-size:21px;font-weight:500}
  .version{margin-top:4px;font-size:13px;color:var(--on2)}
  .pregunta{margin-top:26px;font-size:15px;color:var(--on2)}

  .botones{margin-top:auto;width:100%;display:flex;gap:10px}
  .botones button{flex:1;height:46px;border:none;border-radius:23px;font-size:14.5px;font-weight:600;font-family:inherit}
  .btn-texto{background:transparent;color:var(--primary)}
  .btn-lleno{background:var(--primary);color:#0d2b45}

  /* velo + diálogo de Play Protect */
  .velo{position:absolute;inset:0;background:rgba(0,0,0,.62)}
  .dialogo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:318px;
    background:var(--sup2);border-radius:28px;padding:24px 24px 16px;
    box-shadow:0 24px 60px rgba(0,0,0,.55)}
  .escudo{margin-bottom:14px}
  .dialogo h2{font-size:21px;font-weight:500;letter-spacing:-.2px}
  .dialogo p{margin-top:12px;font-size:14px;line-height:1.55;color:var(--on2)}
  .dialogo .app{color:var(--on);font-weight:600}
  .acciones{margin-top:20px;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
  .acciones button{height:40px;padding:0 14px;border:none;border-radius:20px;background:transparent;
    font-family:inherit;font-size:13.5px;font-weight:700;letter-spacing:.3px;color:var(--primary)}
  .acciones button.fuerte{background:rgba(168,199,250,.14)}
  .enlace{margin-top:6px;text-align:right;font-size:12px;color:var(--on2);opacity:.75}
</style>
</head>
<body>
<div class="pantalla">
  <div class="estado">
    <span>9:41</span>
    <div class="iconos">
      <svg width="14" height="13" viewBox="0 0 14 13" aria-hidden="true"><path d="M7 11.2 1.2 5.3a8.3 8.3 0 0 1 11.6 0L7 11.2Z" fill="#E6E1E5"/></svg>
      <div class="barras"><i></i><i></i><i></i><i></i></div>
      <div class="bateria"><i></i></div>
    </div>
  </div>

  <div class="instalador">
    <div class="icono">
      <svg width="42" height="42" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M9 18V6.6l10-2v10" stroke="#08312a" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="6.6" cy="18" r="2.6" stroke="#08312a" stroke-width="1.9"/>
        <circle cx="16.6" cy="14.6" r="2.6" stroke="#08312a" stroke-width="1.9"/>
      </svg>
    </div>
    <div class="nombre">Bitly</div>
    <div class="version">1.0.0 · Bitly-arm64.apk</div>
    <div class="pregunta">¿Querés instalar esta app?</div>
    <div class="botones">
      <button class="btn-texto">Cancelar</button>
      <button class="btn-lleno">Instalar</button>
    </div>
  </div>

  <div class="velo"></div>

  <div class="dialogo">
    <div class="escudo">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 2.6 4.5 5.4v6.1c0 4.6 3.1 8.6 7.5 9.9 4.4-1.3 7.5-5.3 7.5-9.9V5.4L12 2.6Z"
              stroke="#8AB4F8" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M12 8.4v4.2" stroke="#8AB4F8" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="12" cy="15.7" r="1" fill="#8AB4F8"/>
      </svg>
    </div>
    <h2>App no reconocida</h2>
    <p>Google Play Protect no puede verificar las apps que no se instalan desde Play Store. ¿Querés instalar <span class="app">Bitly</span> de todos modos?</p>
    <div class="acciones">
      <button>Cancelar</button>
      <button class="fuerte">INSTALAR DE TODOS MODOS</button>
    </div>
    <div class="enlace">Enviar comentarios</div>
  </div>
</div>
</body>
</html>
