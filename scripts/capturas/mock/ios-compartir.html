<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iOS · abrir el .ipa con TrollStore</title>
<style>
  :root{--bg:#F2F2F7;--card:#FFFFFF;--tinta:#000;--gris:#8A8A8E;--azul:#0A84FF;--sep:#D9D9DE}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#000;color:var(--tinta);
    font-family:-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased}

  .pantalla{position:relative;width:100%;height:100%;background:var(--bg)}

  /* barra de estado */
  .estado{height:52px;padding:0 26px 0 30px;display:flex;align-items:center;justify-content:space-between;
    font-size:15px;font-weight:600}
  .isla{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:104px;height:30px;border-radius:16px;background:#000}
  .estado .iconos{display:flex;align-items:center;gap:6px}

  /* Archivos */
  .barra{display:flex;align-items:center;justify-content:space-between;padding:2px 18px 8px;color:var(--azul)}
  .barra .titulo{font-size:17px;font-weight:600;color:var(--tinta);margin-right:auto;margin-left:14px}
  .buscador{margin:6px 18px 12px;height:38px;border-radius:10px;background:rgba(120,120,128,.14);
    display:flex;align-items:center;gap:8px;padding:0 10px;color:var(--gris);font-size:16px}

  .lista{margin:0 18px;background:var(--card);border-radius:12px;overflow:hidden}
  .fila{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--sep)}
  .fila:last-child{border-bottom:none}
  .fila .txt{flex:1;min-width:0}
  .fila .nombre{font-size:16px}
  .fila .meta{font-size:13px;color:var(--gris);margin-top:1px}
  .fila .chev{color:#C3C3C8;font-size:18px}

  .doc{width:34px;height:42px;border-radius:6px;background:linear-gradient(160deg,#6f8cff,#3b5bdb);
    display:grid;place-items:center;color:#fff;font-size:10px;font-weight:700;letter-spacing:.5px;flex:none;
    box-shadow:0 2px 5px rgba(0,0,0,.18)}

  .velo{position:absolute;inset:0;background:rgba(0,0,0,.42)}

  /* hoja de compartir */
  .hoja{position:absolute;left:0;right:0;bottom:0;background:#F7F7FA;border-radius:14px 14px 0 0;
    box-shadow:0 -14px 40px rgba(0,0,0,.28);padding:8px 0 22px}
  .agarrar{width:38px;height:5px;border-radius:3px;background:#C9C9CE;margin:4px auto 12px}
  .cabecera{display:flex;align-items:center;gap:12px;padding:0 18px 14px;border-bottom:1px solid var(--sep)}
  .cabecera .nombre{font-size:16px;font-weight:600}
  .cabecera .meta{font-size:13px;color:var(--gris);margin-top:1px}
  .equis{margin-left:auto;width:30px;height:30px;border-radius:50%;background:rgba(120,120,128,.18);
    display:grid;place-items:center;color:#6b6b70;font-size:14px;font-weight:700}

  .apps{display:flex;gap:16px;padding:16px 18px 18px;border-bottom:1px solid var(--sep);overflow:hidden}
  .app{width:64px;text-align:center;flex:none}
  .app .ico{width:58px;height:58px;border-radius:15px;margin:0 auto;display:grid;place-items:center;
    color:#fff;font-size:11px;font-weight:700;box-shadow:0 3px 8px rgba(0,0,0,.16)}
  .app .etq{margin-top:6px;font-size:11px;color:#3c3c43;line-height:1.15}
  .app.destacada .ico{box-shadow:0 0 0 3px var(--azul),0 4px 10px rgba(10,132,255,.35)}
  .app.destacada .etq{font-weight:700;color:var(--azul)}

  .acciones{background:#fff;margin-top:14px;border-top:1px solid var(--sep);border-bottom:1px solid var(--sep)}
  .accion{display:flex;align-items:center;gap:12px;padding:13px 18px;font-size:16px;border-bottom:1px solid var(--sep)}
  .accion:last-child{border-bottom:none}
  .accion .chev{margin-left:auto;color:#C3C3C8}
  .accion.fuerte{background:rgba(10,132,255,.10);font-weight:600;color:var(--azul)}
</style>
</head>
<body>
<div class="pantalla">
  <div class="estado">
    <span>9:41</span>
    <div class="isla"></div>
    <div class="iconos">
      <svg width="18" height="13" viewBox="0 0 18 13" aria-hidden="true">
        <rect x="0" y="8" width="3" height="5" rx="1" fill="#000"/>
        <rect x="4.6" y="5.6" width="3" height="7.4" rx="1" fill="#000"/>
        <rect x="9.2" y="3" width="3" height="10" rx="1" fill="#000"/>
        <rect x="13.8" y="0.6" width="3" height="12.4" rx="1" fill="#000"/>
      </svg>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none" aria-hidden="true">
        <path d="M8.5 10.4 1.6 3.6a10 10 0 0 1 13.8 0L8.5 10.4Z" fill="#000"/>
      </svg>
      <svg width="26" height="13" viewBox="0 0 26 13" aria-hidden="true">
        <rect x="0.5" y="0.5" width="21" height="12" rx="3.5" stroke="rgba(0,0,0,.35)"/>
        <rect x="2.2" y="2.2" width="15" height="8.6" rx="2" fill="#000"/>
        <path d="M23.4 4.6v3.8c1-.3 1.5-.9 1.5-1.9s-.5-1.6-1.5-1.9Z" fill="rgba(0,0,0,.4)"/>
      </svg>
    </div>
  </div>

  <div class="barra">
    <svg width="12" height="20" viewBox="0 0 12 20" fill="none" aria-hidden="true">
      <path d="M10 2 3 10l7 8" stroke="#0A84FF" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="titulo">Descargas</span>
  </div>

  <div class="buscador">
    <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <circle cx="7" cy="7" r="5" stroke="#8A8A8E" stroke-width="1.8"/>
      <path d="m11 11 3.4 3.4" stroke="#8A8A8E" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
    Buscar
  </div>

  <div class="lista">
    <div class="fila">
      <div class="doc">IPA</div>
      <div class="txt"><div class="nombre">Bitly.ipa</div><div class="meta">12,4 MB</div></div>
      <div class="chev">›</div>
    </div>
    <div class="fila">
      <div class="doc" style="background:linear-gradient(160deg,#9aa4b2,#6b7686)">APK</div>
      <div class="txt"><div class="nombre">Bitly-arm64.apk</div><div class="meta">38,1 MB</div></div>
      <div class="chev">›</div>
    </div>
  </div>

  <div class="velo"></div>

  <div class="hoja">
    <div class="agarrar"></div>
    <div class="cabecera">
      <div class="doc">IPA</div>
      <div class="txt"><div class="nombre">Bitly.ipa</div><div class="meta">12,4 MB</div></div>
      <div class="equis">✕</div>
    </div>

    <div class="apps">
      <div class="app">
        <div class="ico" style="background:linear-gradient(160deg,#4dabff,#0a84ff)">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="3" stroke="#fff" stroke-width="2"/>
            <path d="M12 3v3M12 18v3M3 12h3M18 12h3M6 6l2 2M16 16l2 2M18 6l-2 2M8 16l-2 2" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="etq">AirDrop</div>
      </div>
      <div class="app">
        <div class="ico" style="background:linear-gradient(160deg,#5ee27a,#28b43f)">
          <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 4c4 0 7 2.3 7 5.2 0 3-3 5.2-7 5.2-1 0-2-.15-2.9-.42L5 16l1.2-3.2C5.4 11.9 5 10.6 5 9.2C5 6.3 8 4 12 4Z" fill="#fff"/>
          </svg>
        </div>
        <div class="etq">Mensajes</div>
      </div>
      <div class="app">
        <div class="ico" style="background:linear-gradient(160deg,#7ec8ff,#1b7fe0)">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="3" y="6" width="18" height="12" rx="2.4" stroke="#fff" stroke-width="1.9"/>
            <path d="m4.4 7.6 7.6 5.6 7.6-5.6" stroke="#fff" stroke-width="1.9" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="etq">Correo</div>
      </div>
      <div class="app destacada">
        <div class="ico" style="background:linear-gradient(160deg,#43d9a3,#12a97e)">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 3.5v10.6" stroke="#fff" stroke-width="2.1" stroke-linecap="round"/>
            <path d="m7.6 9.4 4.4 4.4 4.4-4.4" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M5 17.5h14" stroke="#fff" stroke-width="2.1" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="etq">TrollStore</div>
      </div>
    </div>

    <div class="acciones">
      <div class="accion fuerte">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="4" y="4" width="16" height="16" rx="4" stroke="#0A84FF" stroke-width="1.9"/>
          <path d="M12 8.5v7M8.5 12h7" stroke="#0A84FF" stroke-width="1.9" stroke-linecap="round"/>
        </svg>
        Abrir con TrollStore
        <span class="chev">›</span>
      </div>
      <div class="accion">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 7.5A2.5 2.5 0 0 1 6.5 5h3l2 2h6A2.5 2.5 0 0 1 20 9.5v7A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5v-9Z" stroke="#8A8A8E" stroke-width="1.7" stroke-linejoin="round"/>
        </svg>
        Guardar en Archivos
        <span class="chev">›</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
