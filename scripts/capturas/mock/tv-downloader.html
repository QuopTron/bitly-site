<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart TV · Downloader</title>
<style>
  :root{--verde:#3ddc84;--on:#FFFFFF;--on2:#9fb3c8}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;color:var(--on);
    font-family:"Segoe UI",Roboto,system-ui,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  body{background:radial-gradient(120% 90% at 50% 0%,#123243 0%,#0c1720 45%,#070b10 100%)}

  .marco{height:100%;display:flex;flex-direction:column;padding:54px 72px 44px}

  .cabecera{display:flex;align-items:center;gap:16px}
  .marca{display:flex;align-items:center;gap:12px}
  .logo{width:42px;height:42px;border-radius:12px;background:rgba(61,220,132,.15);
    border:1px solid rgba(61,220,132,.4);display:grid;place-items:center}
  .marca h1{font-size:26px;font-weight:700;letter-spacing:-.4px}
  .marca h1 em{font-style:normal;color:var(--verde)}
  .hora{margin-left:auto;font-size:16px;color:var(--on2)}

  .centro{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
  .pregunta{font-size:22px;color:var(--on2);letter-spacing:.2px}

  .campo{width:min(880px,86%);height:104px;border-radius:20px;background:rgba(255,255,255,.06);
    border:2px solid rgba(61,220,132,.55);display:flex;align-items:center;gap:20px;padding:0 26px;
    box-shadow:0 0 0 6px rgba(61,220,132,.08),0 24px 50px rgba(0,0,0,.4)}
  .campo .codigo{font-size:46px;font-weight:600;letter-spacing:8px}
  .campo .cursor{width:3px;height:52px;background:var(--verde);border-radius:2px;animation:parpadeo 1.1s steps(1,end) infinite}
  @keyframes parpadeo{50%{opacity:0}}
  .campo .ir{margin-left:auto;display:flex;align-items:center;gap:10px;height:60px;padding:0 26px;
    border-radius:14px;background:var(--verde);color:#05291a;font-size:20px;font-weight:700}

  .ayuda{display:flex;align-items:center;gap:12px;font-size:17px;color:var(--on2)}
  .tecla{display:inline-grid;place-items:center;min-width:38px;height:34px;padding:0 12px;border-radius:8px;
    background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:var(--on);font-size:14px;font-weight:600}

  .pie{display:flex;gap:34px;color:var(--on2);font-size:15px}
  .pie div{display:flex;align-items:center;gap:9px}
  .punto{width:9px;height:9px;border-radius:50%;background:var(--verde)}
</style>
</head>
<body>
  <div class="marco">
    <header class="cabecera">
      <div class="marca">
        <div class="logo">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 3v11" stroke="#3ddc84" stroke-width="2" stroke-linecap="round"/>
            <path d="m7.5 9.5 4.5 4.5 4.5-4.5" stroke="#3ddc84" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M4 18h16" stroke="#3ddc84" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <h1>Down<em>loader</em></h1>
      </div>
      <div class="hora">21:04</div>
    </header>

    <div class="centro">
      <div class="pregunta">Escribí el código del archivo</div>
      <div class="campo">
        <span class="codigo">8134206</span>
        <span class="cursor"></span>
        <div class="ir">
          Descargar
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 12h15m0 0-6-6m6 6-6 6" stroke="#05291a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>
      <div class="ayuda">
        Presioná <span class="tecla">OK</span> en el control para confirmar
      </div>
    </div>

    <footer class="pie">
      <div><span class="punto"></span> APK verificado</div>
      <div><span class="punto"></span> Instalación directa, sin cuenta</div>
      <div><span class="punto"></span> Bitly para Smart TV</div>
    </footer>
  </div>
</body>
</html>
